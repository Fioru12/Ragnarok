name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-rag.txt

    - name: Run unit tests with pytest
      # Two separate invocations, not one `pytest` covering both directories:
      # tests/ and backend/tests/ both import server.py/auth.py at module
      # scope with process-wide side effects (DB init, generated API keys),
      # and running them together in one pytest process causes state to leak
      # between the two suites (110+ spurious 401s). Each directory passes
      # cleanly on its own - verified locally before making this change.
      run: |
        pytest tests/ -v
        pytest backend/tests/ -v
