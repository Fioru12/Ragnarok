name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r backend/requirements-rag.txt

    - name: Run unit tests with pytest
      # A single invocation: root conftest.py pins deterministic env
      # (RAGNAROK_API_KEY, inert anomaly watcher) before any test module
      # imports server.py, so import-order state leaks between suites
      # (spurious 401s) cannot happen.
      run: |
        pytest tests/ backend/tests/ -v
